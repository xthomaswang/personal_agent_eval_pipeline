# The pilot set of the web search suite: 24 rows of SimpleQA Verified, 12 easy and 12 medium, pinned by
# original_index. Dataset fields are copied from the CSV at the pinned revision; data.py checks them against it
# when the CSV is in the Hugging Face cache (fetch.py downloads it).
#
# Hand-set fields, per row:
#   tier        easy or medium
#   kind        how score.py compares: number, year, date, string or list
#   aliases     extra answers that count as correct, added only where a correct short answer would fail the gold
#               (identifiers such as 3352 and 3635 are strings, because a number tolerance would accept a
#               neighbouring alloy or order number)
#   unordered   lists only: the order of the elements does not matter

