<section class="card">
  <p class="muted"><a href="/supply/search">Catalog</a> / {{name}}</p>
  <h1>{{name}}</h1>
  <table class="lines specs">
    <tbody>
      <tr><th>Catalog number</th><td>{{sku}}</td></tr>
      <tr><th>Thread</th><td>{{thread}}</td></tr>
      <tr><th>Length</th><td>{{length}} mm</td></tr>
      <tr><th>Material</th><td>{{material}}</td></tr>
      <tr><th>Pack size</th><td>{{pack}} pieces</td></tr>
      <tr><th>Pack price</th><td>{{price}}</td></tr>
      <tr><th>Manufacturer part number</th><td data-qa="mpn">{{mpn}}</td></tr>
    </tbody>
  </table>
  <div class="actions">
    <button type="button" class="btn primary">Add to quote</button>
    <a class="btn" href="/supply/search">Back to the catalog</a>
  </div>
</section>
