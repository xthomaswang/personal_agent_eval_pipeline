<section class="card">
  <h1>Your cart</h1>
  <table class="lines">
    <thead><tr><th>Item</th><th>Qty</th><th>Price</th></tr></thead>
    <tbody>{{lines}}</tbody>
    <tfoot><tr><th colspan="2">Subtotal</th><td>{{subtotal}}</td></tr></tfoot>
  </table>
  <div class="actions">
    <a class="btn primary" href="/shop/checkout">Check out</a>
    <a class="btn" href="#">Continue shopping</a>
  </div>
</section>
