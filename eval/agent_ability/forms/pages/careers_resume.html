<div class="field">
  <div class="label" id="resume_label">Resume/CV<span class="req">*</span></div>
  <div class="upload" role="group" aria-labelledby="resume_label">
    <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" hidden>
    <button type="button" class="btn" data-attach="resume">Attach</button>
    <span class="muted" id="resume_name">{{attached}}</span>
  </div>
  <p class="hint">PDF, DOC, DOCX &middot; up to 5 MB</p>
</div>
