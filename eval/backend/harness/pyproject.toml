[project]
name = "agentbench"
version = "0.1.0"
description = "Agent-workload benchmark client for local OpenAI/Anthropic-compatible LLM servers (Qwen3.8-27B, M5 Max)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "numpy>=1.26.4",
    "pillow>=12.1.0",
    "tokenizers>=0.22.2",
]

[project.scripts]
agentbench = "agentbench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
