# The harness epoch (DESIGN §6.5): what the capability leg snapshots and what it re-checks live.
#
# capability/epoch.py hashes the content these pins select (git tree hashes of the snapshotted
# directories, config bytes, uv.lock files, the live SHAs and versions, the data commits) into the
# epoch id below. Changing any pinned input is a new epoch, and a new epoch means a new reference
# capability run (DESIGN §7). Make it a deliberate edit: change the pin, run
# `modeleval.capability.epoch.create_epoch(...)`, then write the id it returns here.

[epoch]
id = "7582825160ad"                                   # 2026-10-26 07:1x: localmelo 3b8f310 in the pipeline clone

# Snapshotted with `git archive <sha>:<dir>` into vendor/<epoch>/ (personal-agent-bench/bench,
# harness-smoke/smoke, harness-smoke/shims: the layout the runner imports). The directories belong to
# other sessions. `repo` is relative to the repository root ("." = this repository); bench, smoke and
# shims are each directory's path at `sha`. The epoch hashes their git tree hashes only, so the same
# content at another commit or path is the same epoch (until 2026-10-26 they came from the
# personal-agent-bench and harness-smoke repositories: bench/ 40152a3f, smoke/ a9b62dbe, shims/ bb008bb6).
[snapshot]
repo = "."
sha = "aea8e20d897d624672acd246eb0765a104c5dce4"   # the move under eval/ (2026-10-26); the same three trees
bench = "eval/bench"
smoke = "eval/agent_ability/smoke"
shims = "eval/agent_ability/shims"

# Copied once per epoch into vendor/<epoch>/configs (relative to agent_root)
[configs]
agent_root = "${agent_root}"                        # config.defaults.toml [paths]
claude_env = "configs/claude-code/claude-code.env"
claude_settings = "homes/claude-code/settings.json"
hermes_home = "homes/hermes"                        # tools/ and installs/ stay links to this live store

# Live parts, re-checked before every task
[localmelo]
# The pipeline's own clone (vendor/, gitignored; no remote), so the agent bench moving its worktree
# cannot stop a leg: it moved c295ce2 -> 3b8f310 (U1a, #37) at 07:03 on 2026-10-26, mid-run. Made with
# `git clone --no-hardlinks <localmelo's common git dir> vendor/localmelo`, `git checkout <sha>`,
# `git remote remove origin`; the venv is `UV_PYTHON_DOWNLOADS=never uv sync --frozen --all-extras` from
# the clone's uv.lock: the same package versions as the bench's. Relative to this backend directory.
repo = "vendor/localmelo"
sha = "3b8f310ee68714497bc3a08805c061ad73a106a8"
dist = "localmelo"                                  # .venv/bin/melo must be an editable install of repo

[hermes]
repo = "${agent_root}/hermes-agent"
tag = "v0.22.2"
sha = "d923a5eb487a17c0a68801bba9ef0f56c81040a8"
bin = "${agent_root}/.venv/bin/hermes"
dist = "hermes_agent"

[claude_code]
version = "2.1.302"
bin = "${claude_versions}/2.1.302"

# Task data (fetched by harness-smoke's scripts/fetch_data.py into ml_source)
[data]
root = "${datasets}"
aider_polyglot = "7e0611e77b54e2dea774cdc0aa00cf9f7ed6144f"
mcpmark = "cd45b7f57923b9b3985467f5139927575f83141c"

# Pipeline-owned environments (relative to this backend directory)
[envs]
capability = "envs/capability"                      # Python 3.13: the runner and the recorder proxy
agent_tools = "envs/agent-tools"                    # pytest only: the agents' PATH and the checkers
shims = "envs/agent-tools/shims"                    # pip, pip3, uv, uvx fail on the agents' PATH

[workspace]
# One fixed path for every model and run: it is part of every task prompt (prompt_sha256)
ws_root = "${ws_root}"
