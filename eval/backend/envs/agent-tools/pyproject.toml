# What the agents find first on PATH and what the checkers run the Aider tests and MCPMark verifiers
# with (smoke.paths.SMOKE_VENV_BIN / SMOKE_PYTHON, DESIGN §6.1). pytest only, at harness-smoke's
# version (abddd26), so an agent can change neither the checker's interpreter nor its plugins.
[project]
name = "modeleval-agent-tools"
version = "1"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pytest==9.1.1",
]

[tool.uv]
package = false
# Transitive versions from the same harness-smoke uv.lock
constraint-dependencies = [
    "colorama==0.4.6",
    "iniconfig==2.3.1",
    "packaging==26.3",
    "pluggy==1.7.0",
    "pygments==2.21.0",
]
