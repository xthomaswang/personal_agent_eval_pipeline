# Memory across chats, task set v1 (see eval/memory/README.md, "Memory across chats").
#
# Everything here is fictional: "you" is a made-up user and no fact is about a real person.
#
# facts      taught in `order`, each in its own new chat (one teaching message per chat). `block` groups
#            the order into ten themed batches; it has no effect on the chats.
#            role: plain (asked directly), old/new (a value and the value that replaces it; `supersedes` names
#            the old fact), target/lookalike (a fact and its look-alike; `twin` names the other), filler.
#            The three fillers come last and are long on purpose: localmelo pins the newest "about" and
#            "preferences" quotes (600 characters) into every chat's system prompt, and the fillers fill that
#            window so no asked fact is pinned.
# questions  each asked in a new chat after all teaching.
#            kind: exact (the fact's own words), paraphrase (other words, same language), crosslang (the other
#            language), superseded (the newer value must win), lookalike (a similar fact must not be used),
#            nothing (never taught; the right reply says so).
#            answer + aliases: any of them in the reply is correct. reject: strings that must not appear
#            (stale or look-alike values). wrong_facts: facts whose recall counts as wrong recall.
#
# The ask order is a fixed shuffle: questions sorted by sha256("<ask_seed>:<id>").
version: 1
protocol: across-v1
ask_seed: 7

