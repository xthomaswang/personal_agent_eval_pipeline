# Memory across chats, task set v2 (see eval/memory/README.md, "Memory bench v2").
#
# Everything here is fictional: "you" is a made-up user and no fact is about a real person.
#
# This file holds the kinds built so far (longrange, followup); later steps add more. Kinds, the arms that run
# them and the window rule per arm are the KINDS table in across/data_v2.py.
#
# fixtures  small files (each at most 300 characters) the driver writes into the workspace of every long chat, then
#           so the read-tier tools have something to read.
# filler    the shared pool of filler messages. `tool` names the read-tier tool a message is meant to use
#           (file_read or list_files; neither ever asks for approval); no `tool` is a plain turn.
#           Every filler message asks for a one-sentence answer. No gold string of any item occurs in a filler
#           message or fixture file (the loader checks).
# sets      named orders of the filler pool: 22 tool turns and 18 plain turns, 40 turns, 124 messages after the
#           fact. A model sometimes answers a tool turn without calling the tool (a turn is then 2 messages, not 4),
#           so even at 2 messages per turn 80 follow the fact, past the 64-message window plus 6 (the loader checks).
# items     kind longrange: one chat. opener (turn 1), an optional bridge (turn 2; then the fact is turn 3), the
#             fact, the filler set, then the one ask, in the same chat. note_expected says whether localmelo's
#             note rules are expected to save the fact (false: a detail of the conversation, tracked as such).
#             `reject` strings occur in the opener or bridge (a stale value the answer must not give).
#           kind followup: `facts` are two teaching messages, each in its own new chat; then one chat with the two
#             asks: Q1 recalls the first fact, Q2 is a pronoun follow-up whose answer is the second fact. `wrong`
#             names the items whose facts hold the reject strings.
#           answer + aliases: any of them in the reply is correct; reject: strings that must not appear.
#
# The order items run in is a fixed shuffle: sorted by sha256("<ask_seed>:<id>").
version: 2
protocol: across-v2
ask_seed: 11

fixtures:
  - {path: "todo.md", text: "# Todo\n- water the plants\n- renew the library card\n- book a haircut\n- call the plumber\n"}
