[project]
name = "modeleval"
version = "0.1.0"
description = "Per-model speed and agent-capability evaluation of local LLMs served by oMLX on an M5 Max."
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentbench",
    "httpx>=0.28.1",
]

[project.scripts]
modeleval = "modeleval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.26.0",
]

[tool.uv.sources]
agentbench = { path = "harness", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modeleval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
